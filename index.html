<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FAF4EE">
<title>Vintage Wedding Invitation</title>
<style>
:root{
  --cream:#fbf4e8;
  --ink:#493b2f;
  --red:#ad533e;
  --blue:#4f7488;
  --olive:#939875;
  --shadow:rgba(77,55,34,.14);
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}

body{
  margin:0;
  background-color:#FAF4EE;
  background-image:
    radial-gradient(circle at 18% 24%, rgba(92,76,61,.045) 0 .65px, transparent .8px),
    radial-gradient(circle at 72% 68%, rgba(255,255,255,.55) 0 .7px, transparent .9px),
    repeating-linear-gradient(8deg, rgba(91,74,58,.022) 0 1px, transparent 1px 5px),
    repeating-linear-gradient(98deg, rgba(255,255,255,.07) 0 1px, transparent 1px 7px);
  background-size:7px 7px,9px 9px,100% 8px,100% 11px;
  color:var(--ink);
  font-family:Georgia,"Times New Roman",serif;
}

button{font:inherit}

.page{
  width:min(100%,520px);
  margin:auto;
  min-height:100vh;
  overflow:hidden;
  position:relative;
  box-shadow:none;
  background-color:#FAF4EE;
  background-image:
    radial-gradient(circle at 18% 24%, rgba(92,76,61,.045) 0 .65px, transparent .8px),
    radial-gradient(circle at 72% 68%, rgba(255,255,255,.55) 0 .7px, transparent .9px),
    repeating-linear-gradient(8deg, rgba(91,74,58,.022) 0 1px, transparent 1px 5px),
    repeating-linear-gradient(98deg, rgba(255,255,255,.07) 0 1px, transparent 1px 7px);
  background-size:7px 7px,9px 9px,100% 8px,100% 11px;
}

.section{
  position:relative;
  padding:36px 22px;
  border-bottom:1px solid rgba(130,96,59,.16);
}

.content{position:relative;z-index:2}

.hero{padding:0 0 8px}

.stars{
  text-align:center;
  color:var(--red);
  font-size:12px;
  letter-spacing:.3em;
  margin-bottom:16px;
}

.title-frame{
  height:92px;
  border:2px solid var(--red);
  border-radius:20px 20px 8px 8px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(255,252,246,.24);
}

.placeholder{
  color:rgba(78,59,44,.58);
  font-size:11px;
  letter-spacing:.14em;
  font-weight:700;
}

.divider{
  text-align:center;
  color:var(--red);
  margin:16px 0;
}

.hero-photo{
  width:100%;
  height:auto;
  background:transparent;
  border:0;
  box-shadow:none;
  overflow:hidden;
  transform:none;
  position:relative;
  padding-top:140px;
  padding-bottom:10px;
}
.hero-photo img{
  width:min(84%,430px);
  height:auto;
  display:block;
  margin:0 auto;
  object-fit:contain;
  object-position:center top;
}
.hero-text-space{
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:140px;
  pointer-events:none;
}

.section-title{
  text-align:center;
  color:var(--red);
  font-size:12px;
  letter-spacing:.14em;
  font-weight:700;
  margin-bottom:18px;
}

.section-title::before,
.section-title::after{
  content:"";
  display:inline-block;
  width:38px;
  height:1px;
  background:var(--red);
  vertical-align:middle;
  margin:0 10px;
}

.message-card{
  height:155px;
  border:1px solid #d29b84;
  border-radius:12px;
  background:rgba(255,252,246,.20);
  padding:28px 26px;
}

.lines{display:grid;gap:14px}

.lines i{
  display:block;
  height:1px;
  background:#b8a385;
}

.lines i:nth-child(2){width:90%;margin:auto}
.lines i:nth-child(3){width:75%;margin:auto}
.lines i:nth-child(4){width:55%;margin:auto}

.gallery{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.polaroid{
  background:rgba(255,252,246,.84);
  padding:7px 7px 18px;
  border:1px solid rgba(92,72,55,.08);
  box-shadow:0 3px 8px var(--shadow);
}

.polaroid:nth-child(1){transform:rotate(-2deg)}
.polaroid:nth-child(3){transform:rotate(2deg)}

.gallery-photo{
  aspect-ratio:4/5;
  background:rgba(209,195,175,.70);
  display:grid;
  place-items:center;
  font-size:10px;
  color:rgba(85,67,52,.56);
}

.pager{
  display:flex;
  justify-content:center;
  gap:7px;
  margin-top:18px;
}

.pager span{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#cfbd98;
}

.pager span:first-child{background:#5d5246}

.ticket{
  min-height:145px;
  border:1px solid #cd9877;
  border-radius:12px;
  background:rgba(255,251,244,.24);
  display:grid;
  grid-template-columns:105px 1px 1fr 38px;
  gap:16px;
  align-items:center;
  padding:20px;
}

.date-boxes{display:flex;gap:10px;align-items:center}

.box1{
  width:62px;
  height:76px;
  border:1px solid #ad9878;
}

.box2{
  width:25px;
  height:56px;
  border:1px solid #ad9878;
}

.dashed{
  height:84px;
  border-left:1px dashed #ad9979;
}

.ticket-lines{
  display:grid;
  gap:12px;
}

.ticket-lines i{
  height:1px;
  background:#b49f81;
}

.ticket-lines i:nth-child(1){width:84%}
.ticket-lines i:nth-child(2){width:66%}
.ticket-lines i:nth-child(3){width:48%}

.heart{
  font-size:28px;
  color:#c99379;
}

.location-grid{
  display:grid;
  grid-template-columns:1.1fr .9fr;
  gap:16px;
  align-items:center;
}

.location-copy{
  display:grid;
  gap:14px;
}

.line{
  height:1px;
  background:#b7a185;
}

.line.long{width:100%}
.line.med{width:70%}

.map-btn{
  width:112px;
  height:38px;
  border:0;
  border-radius:7px;
  background:var(--olive);
  color:#fffdf4;
  cursor:pointer;
}

.venue-photo{
  min-height:150px;
  background:rgba(213,201,181,.70);
  border:7px solid rgba(255,252,246,.90);
  box-shadow:0 3px 8px var(--shadow);
  display:grid;
  place-items:center;
  font-size:10px;
  color:rgba(85,67,52,.56);
  transform:rotate(1deg);
}

.contact-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.contact-card{
  min-height:158px;
  border-radius:12px;
  border:1px solid;
  padding:17px 14px;
  display:grid;
  gap:14px;
}

.contact-card.blue{
  border-color:#88a4b0;
  background:rgba(210,226,226,.66);
}

.contact-card.red{
  border-color:#c99481;
  background:rgba(239,215,202,.64);
}

.badge{
  width:32px;
  height:32px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:rgba(255,255,255,.50);
}

.actions{
  display:flex;
  gap:7px;
  margin-top:2px;
}

.actions button{
  flex:1;
  height:34px;
  border:1px solid rgba(79,65,51,.32);
  background:rgba(255,255,255,.48);
  font-size:10px;
}

.accounts{
  display:grid;
  gap:10px;
  margin-top:12px;
}

.account{
  min-height:70px;
  display:grid;
  grid-template-columns:34px 1fr 70px;
  gap:12px;
  align-items:center;
  padding:12px 13px;
  border:1px solid #9ba9a3;
  border-radius:8px;
  background:rgba(239,244,238,.62);
}

.bank{
  font-size:24px;
  color:var(--blue);
}

.account-text{
  display:grid;
  gap:11px;
}

.copy-btn{
  height:36px;
  border:1px solid #829aa3;
  background:rgba(246,249,247,.82);
  color:var(--blue);
}

.footer{
  padding-bottom:88px;
}

.footer-frame{
  width:76%;
  height:70px;
  margin:auto;
  border:2px solid #c48670;
  border-radius:10px;
  display:grid;
  place-items:center;
  background:rgba(255,252,246,.16);
}

.bgm{
  position:fixed;
  right:max(18px,calc((100vw - 520px)/2 + 18px));
  bottom:20px;
  width:54px;
  height:54px;
  border-radius:50%;
  border:2px solid #823e2d;
  background:var(--red);
  color:#fff;
  font-size:22px;
  z-index:50;
  box-shadow:0 5px 14px rgba(0,0,0,.18);
}

.bgm.playing{
  background:var(--blue);
  border-color:#3d6174;
}

.toast{
  position:fixed;
  left:50%;
  bottom:84px;
  transform:translateX(-50%);
  background:#40382f;
  color:#fff;
  padding:9px 13px;
  font:12px Arial,sans-serif;
  opacity:0;
  transition:.2s;
  z-index:60;
}

.toast.show{opacity:1}

@media(max-width:420px){
  .section{padding-left:18px;padding-right:18px}
  .ticket{
    grid-template-columns:94px 1px 1fr 28px;
    gap:11px;
    padding:16px;
  }
  .contact-card{padding:15px 11px}
}

body.locked{
  height:100vh;
  overflow:hidden;
}

.intro-screen{
  position:fixed;
  inset:0;
  z-index:120;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0;
  border:0;
  background:#FAF4EE;
  cursor:pointer;
  transition:opacity .55s ease, visibility .55s ease;
}

.intro-screen.hidden{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

.intro-cover-image{
  width:100%;
  height:100%;
  display:block;
  object-fit:contain;
  object-position:center;
  user-select:none;
  -webkit-user-drag:none;
}

</style>
</head>

<body class="locked">

<button id="introScreen" class="intro-screen" type="button" aria-label="청첩장 열기">
  <img class="intro-cover-image" src="./cover-01.png" alt="청첩장 인트로 이미지">
</button>

<main class="page">

<section class="section hero">
  <div class="content">
    <div class="hero-photo">
      <div class="hero-text-space" aria-hidden="true"></div>
      <img src="./main-03.png" alt="신랑 신부 메인 사진">
    </div>
  </div>
</section>

<section class="section">
  <div class="content">
    <div class="section-title">WELCOME</div>
    <div class="message-card">
      <div class="lines"><i></i><i></i><i></i><i></i></div>
    </div>
  </div>
</section>

<section class="section">
  <div class="content">
    <div class="section-title">OUR GALLERY</div>
    <div class="gallery">
      <div class="polaroid"><div class="gallery-photo">PHOTO 01</div></div>
      <div class="polaroid"><div class="gallery-photo">PHOTO 02</div></div>
      <div class="polaroid"><div class="gallery-photo">PHOTO 03</div></div>
    </div>
    <div class="pager"><span></span><span></span><span></span><span></span></div>
  </div>
</section>

<section class="section">
  <div class="content">
    <div class="section-title">THE BIG DAY</div>
    <div class="ticket">
      <div class="date-boxes">
        <div class="box1"></div>
        <div class="box2"></div>
      </div>
      <div class="dashed"></div>
      <div class="ticket-lines"><i></i><i></i><i></i></div>
      <div class="heart">♡</div>
    </div>
  </div>
</section>

<section class="section">
  <div class="content">
    <div class="section-title">LOCATION</div>
    <div class="location-grid">
      <div class="location-copy">
        <div class="line long"></div>
        <div class="line med"></div>
        <button class="map-btn" onclick="showToast('지도 연결 자리')">MAP</button>
      </div>
      <div class="venue-photo">VENUE PHOTO</div>
    </div>
  </div>
</section>

<section class="section">
  <div class="content">
    <div class="section-title">CONTACT & ACCOUNT</div>

    <div class="contact-grid">
      <div class="contact-card blue">
        <div class="badge">☎</div>
        <div class="line med"></div>
        <div class="line long"></div>
        <div class="actions">
          <button onclick="showToast('전화 연결 자리')">CALL</button>
          <button onclick="showToast('문자 연결 자리')">SMS</button>
        </div>
      </div>

      <div class="contact-card red">
        <div class="badge">☎</div>
        <div class="line med"></div>
        <div class="line long"></div>
        <div class="actions">
          <button onclick="showToast('전화 연결 자리')">CALL</button>
          <button onclick="showToast('문자 연결 자리')">SMS</button>
        </div>
      </div>
    </div>

    <div class="accounts">
      <div class="account">
        <div class="bank">▥</div>
        <div class="account-text">
          <div class="line med"></div>
          <div class="line long"></div>
        </div>
        <button class="copy-btn" onclick="showToast('계좌 복사 자리')">COPY</button>
      </div>

      <div class="account">
        <div class="bank">▥</div>
        <div class="account-text">
          <div class="line med"></div>
          <div class="line long"></div>
        </div>
        <button class="copy-btn" onclick="showToast('계좌 복사 자리')">COPY</button>
      </div>
    </div>
  </div>
</section>

<section class="section footer">
  <div class="content">
    <div class="divider">— ♡ —</div>
    <div class="footer-frame placeholder">FOOTER TEXT</div>
  </div>
</section>

</main>

<button id="bgmBtn" class="bgm" type="button" aria-label="BGM 재생 또는 정지">♪</button>

<audio id="bgm" loop>
  <source src="./music/wedding-bgm.mp3" type="audio/mpeg">
</audio>
<div id="toast" class="toast">TEST</div>

<script>
const body = document.body;
const intro = document.getElementById("introScreen");
const bgm = document.getElementById("bgm");
const bgmBtn = document.getElementById("bgmBtn");
const toast = document.getElementById("toast");

let playing = false;

function showToast(message){
  toast.textContent = message;
  toast.classList.add("show");
  window.setTimeout(() => toast.classList.remove("show"), 1400);
}

async function openInvitation(){
  body.classList.remove("locked");
  intro.classList.add("hidden");

  window.setTimeout(() => {
    intro.style.display = "none";
  }, 650);

  window.scrollTo({ top: 0, behavior: "auto" });

  if (!bgm) return;

  try{
    await bgm.play();
    playing = true;
    bgmBtn.textContent = "Ⅱ";
    bgmBtn.classList.add("playing");
  }catch(error){
    playing = false;
    bgmBtn.textContent = "♪";
    bgmBtn.classList.remove("playing");
  }
}

async function toggleBgm(){
  if (!bgm){
    showToast("BGM 파일을 넣어주세요");
    return;
  }

  try{
    if (playing){
      bgm.pause();
      playing = false;
      bgmBtn.textContent = "♪";
      bgmBtn.classList.remove("playing");
    } else {
      await bgm.play();
      playing = true;
      bgmBtn.textContent = "Ⅱ";
      bgmBtn.classList.add("playing");
    }
  }catch(error){
    showToast("music/wedding-bgm.mp3 파일을 넣어주세요");
  }
}

intro.addEventListener("click", openInvitation);

if (bgmBtn){
  bgmBtn.addEventListener("click", toggleBgm);
}
</script>
</body>
</html>
